<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210" />
      <stop offset="50%" stop-color="#071a14" />
      <stop offset="100%" stop-color="#030806" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="160" fill="url(#glowGrad)" />

  <!-- Orbital Rings -->
  <circle cx="200" cy="200" r="140" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6 6" />
  <circle cx="200" cy="200" r="110" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.35" />
  <circle cx="200" cy="200" r="80" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 4" />

  <!-- Nodes -->
  <circle cx="200" cy="60" r="5" fill="#34d399" />
  <circle cx="340" cy="200" r="5" fill="#10b981" />
  <circle cx="200" cy="340" r="5" fill="#34d399" />
  <circle cx="60" cy="200" r="5" fill="#10b981" />

  <!-- Subtle AI Neural Network Mesh -->
  <line x1="120" y1="120" x2="200" y2="140" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="280" y1="120" x2="200" y2="140" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="200" y1="140" x2="200" y2="260" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="120" y1="280" x2="200" y2="260" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" />
  <line x1="280" y1="280" x2="200" y2="260" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Stylized Monogram Avatar -->
  <g transform="translate(200, 195) scale(1)">
    <!-- Shield/Hexagon Badge Background -->
    <path d="M0 -65 L55 -32 L55 35 L0 65 L-55 35 L-55 -32 Z" fill="#041f17" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Stylized Initials SC -->
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="1">SC</text>
  </g>

  <!-- Title Badge Underneath -->
  <rect x="110" y="300" width="180" height="30" rx="15" fill="#031b14" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
  <text x="200" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="2">AI DEVELOPER</text>
</svg>
